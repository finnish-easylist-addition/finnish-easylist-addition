name: Deploy to gh-pages branch

on:
  push:
    branches:
      - master
    paths:
      - 'Finland_adb.txt'
      - 'Finland_adb_uBO_extras.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish lists
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Copy filter lists from master
        shell: bash
        run: |
          set -euo pipefail

          git fetch --depth=1 origin master

          git show FETCH_HEAD:Finland_adb.txt > Finland_adb.txt
          git show FETCH_HEAD:Finland_adb_uBO_extras.txt > Finland_adb_uBO_extras.txt

      - name: Update last-modified field
        shell: bash
        run: |
          set -euo pipefail

          DATE=$(LC_ALL=C TZ=Europe/Helsinki date -R)

          TIMESTAMP_LINES=$(grep -c '^! Last modified:' Finland_adb.txt || true)

          if [[ "$TIMESTAMP_LINES" -ne 1 ]]; then
            echo "::error file=Finland_adb.txt::Tiedostossa pitää olla täsmälleen yksi '! Last modified:' -rivi."
            exit 1
          fi

          sed -i \
            "0,/^! Last modified:/s|^! Last modified:.*$|! Last modified: ${DATE}|" \
            Finland_adb.txt

          echo "Asetettu aikaleima:"
          grep '^! Last modified:' Finland_adb.txt

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- \
            Finland_adb.txt \
            Finland_adb_uBO_extras.txt
          then
            echo "Ei julkaistavia muutoksia."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Finland_adb.txt \
            Finland_adb_uBO_extras.txt

          git commit -m "Update modified filter lists"
          git push origin HEAD:gh-pages
